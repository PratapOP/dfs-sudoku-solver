<!DOCTYPE html>
<html>
<head>
    <title>DFS Sudoku Solver</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<h1>DFS Sudoku Solver (Educational Mode)</h1>

<div class="container">
    <div class="grid" id="grid"></div>

    <div class="panel">
        <label>
            <input type="checkbox" id="eduMode" checked>
            Educational Mode
        </label>

        <button onclick="solve()">Solve</button>
        <button onclick="clearGrid()">Clear</button>

        <div class="log" id="log"></div>
    </div>
</div>

<script src="/static/js/script.js"></script>
</body>
</html>
